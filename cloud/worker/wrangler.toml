name = "argus-sync"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# The mobile PWA is served by this same Worker (one URL for everything).
# Requests that do not match a file (/api/*, /ingest/*, /setup/*, ...) run the Worker.
[assets]
directory = "../dashboard"

# Deployed automatically by .github/workflows/deploy-cloud.yml, which
# creates the D1 database on first run and fills in its id here.
[[d1_databases]]
binding = "DB"
database_name = "argus-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
