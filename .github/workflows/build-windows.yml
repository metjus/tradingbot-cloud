name: Build Windows installer (ARGUS CFE)

on:
  push:
    branches: [claude/argus-cfe-strategy]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # publish the installer to the "cfe-latest" release (never "latest")

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,desktop]" pyinstaller

      - name: Run tests on Windows
        run: python -m pytest -q

      - name: Build ARGUS.exe (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --name ARGUS-CFE --windowed
          --icon desktop/argus.ico
          --paths .
          --add-data "argus/ui;argus/ui"
          --collect-submodules argus
          --hidden-import argus.app
          desktop/argus_shell.py

      - name: Smoke-test the frozen engine
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/ARGUS-CFE/ARGUS-CFE.exe" -ArgumentList "--engine" -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:7422/api/health" -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            if ($p.HasExited) { break }
          }
          if (-not $ok) {
            Write-Host "engine did not come up (exited: $($p.HasExited))"
            Get-ChildItem -Recurse "$env:APPDATA/ARGUS-CFE" -ErrorAction SilentlyContinue | Select-Object FullName, Length
            Write-Host "--- argus.log"
            Get-Content "$env:APPDATA/ARGUS-CFE/logs/argus.log" -ErrorAction SilentlyContinue
            Write-Host "--- engine-stdio.log"
            Get-Content "$env:APPDATA/ARGUS-CFE/logs/engine-stdio.log" -ErrorAction SilentlyContinue
            exit 1
          }
          $html = (Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:7422/app/").Content
          if ($html -notmatch "ARGUS") { Write-Host "UI page missing"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "frozen engine OK"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $version = "1.2.$($env:GITHUB_RUN_NUMBER)"
          & $iscc "/DAppVersion=$version" desktop/argus.iss
          Get-Item dist/ARGUS-CFE-setup.exe

      - name: Installer detects an existing installation
        shell: pwsh
        run: |
          # 1st install, then run the same installer again: it must find the
          # first one (this is what shows the "reinstall / update" page)
          $a = Start-Process dist/ARGUS-CFE-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART','/LOG=install1.log' -Wait -PassThru
          if ($a.ExitCode -ne 0) { Get-Content install1.log -Tail 40; exit 1 }
          $b = Start-Process dist/ARGUS-CFE-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART','/LOG=install2.log' -Wait -PassThru
          if ($b.ExitCode -ne 0) { Get-Content install2.log -Tail 40; exit 1 }
          Select-String -Path install1.log -Pattern 'ARGUS:'
          if (-not (Select-String -Path install2.log -Pattern 'predchadzajuca instalacia najdena' -Quiet)) {
            Write-Host "--- install2.log"; Select-String -Path install2.log -Pattern 'ARGUS:'
            Write-Host "second run did NOT detect the first installation"; exit 1
          }
          Select-String -Path install2.log -Pattern 'ARGUS:'
          Write-Host "upgrade detection OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARGUS-CFE-setup
          path: dist/ARGUS-CFE-setup.exe

      - name: Publish to "cfe-latest" release (separate version)
        if: github.ref == 'refs/heads/claude/argus-cfe-strategy'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "1.2.$($env:GITHUB_RUN_NUMBER)"
          gh release delete cfe-latest --yes 2>$null; if ($LASTEXITCODE -ne 0) { Write-Host "no previous release" }
          git push origin :refs/tags/cfe-latest 2>$null; if ($LASTEXITCODE -ne 0) { Write-Host "no previous tag" }
          gh release create cfe-latest dist/ARGUS-CFE-setup.exe --prerelease --latest=false `
            --title "ARGUS CFE $version (samostatná verzia)" `
            --notes "Samostatná verzia ARGUS so stratégiou CFE (iba paper). Inštaluje sa vedľa hlavného ARGUS (vlastný priečinok, dáta %APPDATA%\ARGUS-CFE, port 7422). CFE nepreukázala zisk po poplatkoch (backtest -0,022 R/obchod). Zmeny: docs/CFE.md. Build z commitu $env:GITHUB_SHA."
          exit 0
