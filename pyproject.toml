[project]
name = "argus-engine"
version = "0.3.0"
description = "ARGUS - Autonomous Trading Intelligence (engine core)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "websockets>=13",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "anthropic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
desktop = ["PySide6>=6.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: tests hitting real external APIs (run with -m live)"]
addopts = "-m 'not live'"

[tool.setuptools.packages.find]
include = ["argus*"]
